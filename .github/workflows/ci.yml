name: Gaia Insights CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  frontend-ci:
    name: Frontend Quality & Build (React 19 + Vitest + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint Code (oxlint)
        run: npm run lint

      - name: Run Frontend Tests (Vitest)
        run: npm run test

      - name: Build Production Assets
        run: npm run build

  backend-ci:
    name: Backend Quality & Tests (Python 3.11 + FastAPI + Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Geospatial System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev libproj-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade Pip & Install Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Backend Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Core Unit Tests (Pytest)
        run: |
          python -m pytest backend/tests/test_config.py backend/tests/test_catalog.py backend/tests/test_availability.py backend/tests/test_health.py -v
